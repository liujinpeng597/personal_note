<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ url_for('main.home') }}">个人笔记</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">菜单</button>
    <nav id="site-nav" class="site-nav" aria-label="主导航">
      {% if current_user %}
        <a class="nav-link" href="{{ url_for('notes.list') }}">我的笔记</a>
        <a class="btn btn-primary" href="{{ url_for('notes.editor_new') }}">写笔记</a>
        <div class="user-menu">
          <button class="user-menu__trigger" type="button" aria-haspopup="menu" aria-expanded="false">
            {% if current_user.avatar_url %}
            <img class="avatar" src="{{ current_user.avatar_url }}" alt="{{ current_user.username }} 的头像">
            {% else %}
            <span class="avatar avatar--letter">{{ current_user.username[0]|upper }}</span>
            {% endif %}
            <span class="user-menu__name">{{ current_user.username }}</span>
          </button>
          <div class="user-menu__panel" role="menu" hidden>
            <a role="menuitem" href="{{ url_for('user.profile', username=current_user.username) }}">个人主页</a>
            <a role="menuitem" href="{{ url_for('user.settings') }}">设置</a>
            <form method="post" action="{{ url_for('auth.logout_form') }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button role="menuitem" type="submit">退出</button>
            </form>
          </div>
        </div>
      {% else %}
        <a class="nav-link" href="{{ url_for('main.about') }}">关于</a>
        <a class="nav-link" href="{{ url_for('auth.login_page') }}">登录</a>
        <a class="btn btn-primary" href="{{ url_for('auth.register_page') }}">注册</a>
      {% endif %}
    </nav>
  </div>
</header>

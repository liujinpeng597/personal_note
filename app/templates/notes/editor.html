{% extends 'base.html' %}
{% block title %}{{ '编辑笔记' if note else '写笔记' }} · 个人笔记{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/notes.css') }}">{% endblock %}

{% block content %}
<div class="container">
  <div class="page-head">
    <h1>{{ '编辑笔记' if note else '写笔记' }}</h1>
    <div class="note-actions__row">
      <button class="btn" type="button" id="save-draft"
              data-note-id="{{ note.id if note else '' }}">存草稿</button>
      <button class="btn btn-primary" type="button" id="publish"
              data-note-id="{{ note.id if note else '' }}">发布</button>
    </div>
  </div>

  <div class="editor" id="editor" data-mode="write">
    <div class="editor__toolbar">
      <div class="field field--inline">
        <label for="title">标题</label>
        <input id="title" name="title" type="text" maxlength="120" value="{{ note.title if note else '' }}"
               placeholder="给这篇笔记起个名字">
      </div>
      <div class="field field--inline">
        <label for="tags">标签</label>
        <input id="tags" name="tags" type="text" value="{{ tags_text }}"
               placeholder="用逗号分隔，最多 5 个">
      </div>
      <div class="editor__tools">
        <button class="btn btn-sm" type="button" id="insert-image">插入图片</button>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
        <div class="editor__switch" role="group" aria-label="写作或预览">
          <button class="btn btn-sm" type="button" data-mode-btn="write">写作</button>
          <button class="btn btn-sm" type="button" data-mode-btn="preview">预览</button>
        </div>
      </div>
    </div>

    <div class="editor__body">
      <div class="editor__pane editor__pane--write">
        <label class="sr-only" for="content-md">正文（Markdown）</label>
        <textarea id="content-md" name="content_md" spellcheck="false"
                  placeholder="# 从这里开始写…">{{ note.content_md if note else '' }}</textarea>
      </div>
      <div class="editor__pane editor__pane--preview">
        <p class="text-meta" id="preview-status" aria-live="polite"></p>
        <div class="prose" id="preview"></div>
      </div>
    </div>
  </div>
  <p class="text-meta" id="editor-hint">支持 Markdown：标题、列表、代码块、表格、链接与图片。</p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dialog.js') }}"></script>
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
